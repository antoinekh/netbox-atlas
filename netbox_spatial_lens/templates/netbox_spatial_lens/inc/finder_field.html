{% comment %}
One value of a custom field in its finder, in the choice set's colour, with how many racks or
devices on the page carry it.
{% endcomment %}
<div class="lens-finder__row" data-lens-pick="{{ row.key }}" data-lens-name="{{ row.label }}"
     tabindex="0" role="checkbox" aria-checked="false">
  <span class="lens-finder__tick" aria-hidden="true"></span>
  <span class="lens-cable__dot" style="background: {{ row.colour }};"></span>
  <span class="lens-finder__name">{{ row.label }}</span>
  <span class="text-muted small lens-finder__meta">{{ row.count }}</span>
</div>

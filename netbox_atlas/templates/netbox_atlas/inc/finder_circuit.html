{% comment %}
One circuit in the circuit finder. Named by both of its ends, which is how somebody looks for it.
{% endcomment %}
<div class="atlas-finder__row" data-atlas-pick="{{ row.circuit.pk }}"
     data-atlas-name="{{ row.label }} {{ row.a.label }} {{ row.z.label }}"
     data-atlas-filterable="circuits" data-band="{{ row.colour }}" tabindex="0" role="checkbox"
     aria-checked="false">
  <span class="atlas-finder__tick" aria-hidden="true"></span>
  <span class="atlas-cable__dot" style="background: {{ row.colour }};"></span>
  <span class="atlas-finder__name">
    {{ row.a.label }} <i class="mdi mdi-arrow-right text-muted"></i> {{ row.z.label }}
  </span>
  <span class="text-muted small atlas-finder__meta">{{ row.circuit.provider }}</span>
  <a class="atlas-cable__open" href="{{ row.circuit.get_absolute_url }}"
     title="Open {{ row.circuit.cid }}"><i class="mdi mdi-open-in-new"></i></a>
</div>

{% comment %}
One value of a custom field in its finder, in the choice set's colour, with how many racks or
devices on the page carry it.
{% endcomment %}
<div class="atlas-finder__row" data-atlas-pick="{{ row.key }}" data-atlas-name="{{ row.label }}"
     tabindex="0" role="checkbox" aria-checked="false">
  <span class="atlas-finder__tick" aria-hidden="true"></span>
  <span class="atlas-cable__dot" style="background: {{ row.colour }};"></span>
  <span class="atlas-finder__name">{{ row.label }}</span>
  <span class="text-muted small atlas-finder__meta">{{ row.count }}</span>
</div>

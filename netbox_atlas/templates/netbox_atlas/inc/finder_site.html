{% comment %}
One site in the site finder.

The row is the tick. Its icon is the other thing you can do with a site, with a target of its
own, because a row that does two things depending on where you land does neither predictably.
{% endcomment %}
<div class="atlas-finder__row" data-atlas-pick="{{ row.key }}" data-atlas-name="{{ row.label }}"
     data-atlas-filterable="sites" data-band="{{ row.band }}" tabindex="0" role="checkbox"
     aria-checked="false">
  <span class="atlas-finder__tick" aria-hidden="true"></span>
  <span class="atlas-cable__dot" style="background: {{ row.colour }};"></span>
  <span class="atlas-finder__name">{{ row.label }}</span>
  <span class="text-muted small atlas-finder__meta">{{ row.detail }}</span>
  <a class="atlas-cable__open" href="{{ row.url }}"
     title="{{ row.action }}: {{ row.label }}"><i class="mdi mdi-open-in-new"></i></a>
</div>
